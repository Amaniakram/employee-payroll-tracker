<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Payroll Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p>Welcome to the Employee Payroll Tracker! This application helps you manage and track employee payroll efficiently.</p>


    <button id="addEmployeeBtn">Add Employee</button>
    <table id="employeeTable" border="1">
        <thead>
            <tr>
                <th>Name</th>
                <th>Position</th>
                <th>Salary</th>
            
            </tr>
        </thead>
        <tbody>
            <!-- Employee rows will be dynamically added here -->
        </tbody>
    </table>
    
    <button id="viewPayrollBtn">View Payroll</button>
    <table id="payrollTable" border="1">
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Salary</th>
            </tr>
        </thead>
 
         <tbody id="payrollTableBody">
            <!-- Payroll rows will be dynamically added here -->
        </tbody>
    </table>
    <script src="index.js"></script>
    </body>
</html>
